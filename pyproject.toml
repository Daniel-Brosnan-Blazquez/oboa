[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "oboa"
version = "0.1.0"
description = "Orchestrator for Business Operations Analysis"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "AUTHORS"]
authors = [{name = "Daniel Brosnan Blázquez"}]
keywords = ["orchestration", "archiving", "file-processing", "postgresql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Archiving",
]
dependencies = [
    "aboa==0.2.0",
    "sqlalchemy==1.3.22",
    "psycopg2-binary==2.9.11",
    "python-dateutil==2.9.0.post0",
    "lxml==6.0.2",
]

[project.optional-dependencies]
tests = ["pytest==8.4.2", "pytest-cov==7.0.0"]

[project.urls]
Homepage = "https://github.com/Daniel-Brosnan-Blazquez/oboa"
Repository = "https://github.com/Daniel-Brosnan-Blazquez/oboa"
Issues = "https://github.com/Daniel-Brosnan-Blazquez/oboa/issues"

[project.scripts]
"oboa_init.py" = "oboa.scripts.oboa_init:main"
"oboa_configure.py" = "oboa.scripts.oboa_configure:main"
"oboa_orchestrate.py" = "oboa.scripts.oboa_orchestrate:main"
"oboa_poll.py" = "oboa.scripts.oboa_poll:main"
"oboa_daemon.py" = "oboa.scripts.oboa_daemon:main"
"oboa_query.py" = "oboa.scripts.oboa_query:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["oboa", "oboa.*"]
namespaces = false

[tool.setuptools.package-data]
"oboa.config" = ["*.json", "*.xml"]
"oboa.datamodel" = ["*.dbm", "*.sql"]
"oboa.schemas" = ["*.xsd"]
"oboa.scripts" = ["*.sh"]
