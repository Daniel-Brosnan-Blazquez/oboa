name: OBOA packaging and PyPI publishing using GitHub Actions

on:
  push:
    branches: ["*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Check release tag matches the package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          with open("pyproject.toml", "rb") as metadata:
              version = tomllib.load(metadata)["project"]["version"]
          if os.environ["RELEASE_TAG"] != "v" + version:
              raise SystemExit("Release tag must be v" + version)
          PY
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate PyPI metadata and README
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  test-install:
    name: Test installed ${{ matrix.distribution }} on Python ${{ matrix.python }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
        distribution: [wheel, sdist]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist
      - name: Install release artifact and test dependencies
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          if [ "$DISTRIBUTION" = wheel ]; then
            python -m pip install dist/*.whl
          else
            python -m pip install dist/*.tar.gz
          fi
          python -m pip install pytest==8.4.2 pytest-cov==7.0.0
          python -m pip check
      - name: Check installed resources and commands outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tools/check_distribution.py"
      - name: Test packaged resources, configuration, and logging
        env:
          OBOA_LOG_PATH: ${{ runner.temp }}/oboa-log
        run: >-
          python -m pytest -q
          src/tests/test_configuration.py
          src/tests/test_functions.py
          src/tests/test_logging.py

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [build, test-install]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/oboa/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
