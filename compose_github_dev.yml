services:

   oboa_db:
      image: mdillon/postgis
      container_name: oboa_db
      restart: always
      shm_size: 512M
      command: -c max_connections=100 -c max_locks_per_transaction=128
      networks:
         - boa_network

   oboa:
      build:
         context: .
         dockerfile: Dockerfile.github.dev
         args:
            REPOSITORY_URI: ${REPOSITORY_URI}
            GITHUB_BRANCH: ${GITHUB_BRANCH}
            ABOA_REPOSITORY_URI: ${ABOA_REPOSITORY_URI:-}
            ABOA_GITHUB_BRANCH: ${ABOA_GITHUB_BRANCH:-main}
            UID_HOST_USER: ${UID_HOST_USER:-1000}
            GID_HOST_USER: ${GID_HOST_USER:-1000}
      container_name: oboa
      restart: always
      hostname: oboa
      user: "${UID_HOST_USER:-1000}:${GID_HOST_USER:-1000}"
      environment:
         - OBOA_DDBB_HOST=oboa_db
      shm_size: 512M
      networks:
         - boa_network

networks:
   boa_network:
      name: boa_network
